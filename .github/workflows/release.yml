name: Release

# v0.3 sunset desktop: this workflow built `.dmg` artifacts for the Tauri
# desktop app via `cargo tauri build`. v0.2.3 was the final desktop release;
# v0.3+ ships only as a web app at https://hashly.pages.dev. Workflow gated
# to only fire for legacy `v0.2.x` tags so existing release infrastructure
# is preserved should a hotfix ever be needed.
#
# A v0.3.x tag will not trigger this workflow. The web app is deployed by
# Cloudflare Pages from main; no release tag is required.

on:
  push:
    tags:
      - 'v0.2.*'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install librsvg
        # Defensive: the rasterized 1024 PNG and the generated icon set
        # are committed to git, so the release build does NOT rasterize
        # the SVG. librsvg is here only so a future workflow change can
        # regenerate icons in CI without a separate setup step.
        run: brew install librsvg

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: npm ci
        run: npm ci

      - name: cargo tauri build
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Upload .dmg to release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
