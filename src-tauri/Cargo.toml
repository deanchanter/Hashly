[package]
name = "hashly"
version = "0.2.3"
edition = "2021"
rust-version = "1.77"
description = "Hashly — a WYSIWYG markdown reader"
default-run = "hashly"

[lib]
name = "hashly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hashly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
