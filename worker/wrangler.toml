name = "hashly-worker"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Public, non-secret config. Real secrets go through `wrangler secret put`.
[vars]
AUTH_METHOD = "app"
GITHUB_APP_SLUG = "hashly-md"

# Routes will be configured at deploy time; placeholder only.
# routes = [
#   { pattern = "api.hashly.dev/*", zone_name = "hashly.dev" }
# ]

# Session storage. Real KV namespace IDs are wired up at deploy time;
# the test harness mocks this binding via @cloudflare/vitest-pool-workers.
[[kv_namespaces]]
binding = "SESSIONS"
id = "1198a0321a05437fb246d041ad7c7953"
